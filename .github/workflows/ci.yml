name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: postgresql://support:support_test@127.0.0.1:5432/support_platform_test
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support_test
          POSTGRES_DB: support_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_platform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:check
      - run: pnpm test:db
      - run: pnpm test:ai
      - run: pnpm test:github
      - run: pnpm ai:evaluate
      - run: pnpm build
